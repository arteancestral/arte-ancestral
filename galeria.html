<script>
(()=>{const lb=document.querySelector("#lb"),big=document.querySelector("#big");let y=0,last=null;
function open(img){y=scrollY;last=img;big.src=img.src;big.alt=img.alt;lb.classList.add("open");document.body.style.overflow="hidden"}
function close(){lb.classList.remove("open");big.removeAttribute("src");document.body.style.overflow="";scrollTo(0,y);if(last)last.focus({preventScroll:true})}
document.querySelectorAll(".grid img").forEach(i=>{i.onclick=()=>open(i);i.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open(i)}}});
document.querySelector("#back").onclick=close;document.querySelector("#x").onclick=close;lb.onclick=e=>{if(e.target===lb)close()};document.onkeydown=e=>{if(e.key==="Escape"&&lb.classList.contains("open"))close()};})();
</script></body></html>
